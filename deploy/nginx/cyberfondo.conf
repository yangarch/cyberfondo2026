# 사이버폰도 상장 페이지 (정적 파일)
# 설치: sudo cp deploy/nginx/cyberfondo.conf /etc/nginx/conf.d/ && sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name _;                       # 도메인이 있으면 교체

    root /var/www/cyberfondo;            # web/ 디렉터리 내용을 여기에 복사
    index index.html;

    location = /results.json {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
