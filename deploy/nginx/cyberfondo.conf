# 사이버폰도 상장 페이지 (정적 파일, https://cyberfondo.yangarch.net:4080)
# 설치는 deploy/setup_https.sh 참고 (인증서 발급 후에 이 파일을 넣어야 nginx -t 통과)
server {
    listen 4080 ssl http2;
    server_name cyberfondo.yangarch.net;

    ssl_certificate     /etc/letsencrypt/live/cyberfondo.yangarch.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cyberfondo.yangarch.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:cyberfondo_ssl:1m;

    # 같은 포트로 http:// 접속하면 https로 이동
    error_page 497 =301 https://$host:4080$request_uri;

    root /var/www/cyberfondo;            # web/ 디렉터리 내용을 여기에 복사
    index index.html;

    location = /results.json {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
