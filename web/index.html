<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사이버폰도 상장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Song+Myung&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4efe3;
    --fg: #2b2418;
    --muted: #7a6d57;
    --accent: #9b1c1c;
    --card: #fffdf7;
    --line: #d9cfb8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Nanum Myeongjo", serif;
    min-height: 100vh;
  }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 {
    font-family: "Song Myung", serif;
    font-weight: 400;
    font-size: 40px;
    text-align: center;
    margin: 0 0 4px;
    letter-spacing: 0.1em;
  }
  .sub { text-align: center; color: var(--muted); margin: 0 0 32px; }
  form { display: flex; gap: 8px; }
  input {
    flex: 1; min-width: 0;
    font: inherit; font-size: 18px;
    padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--fg);
  }
  button {
    font: inherit; font-size: 16px; font-weight: 700;
    padding: 12px 18px;
    border: 0; border-radius: 8px;
    background: var(--accent); color: #fff;
    cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  #msg { margin: 16px 0 0; color: var(--muted); text-align: center; min-height: 1.5em; }
  #choices { list-style: none; padding: 0; margin: 8px 0 0; }
  #choices button {
    width: 100%; text-align: left; margin-top: 6px;
    background: var(--card); color: var(--fg); border: 1px solid var(--line); font-weight: 400;
  }
  #choices small { color: var(--muted); margin-left: 6px; }
  #result { margin-top: 32px; display: none; }
  #result canvas {
    width: 100%; height: auto; display: block;
    box-shadow: 0 6px 24px rgba(60, 40, 10, 0.25);
  }
  .actions { display: flex; gap: 8px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
</style>
</head>
<body>
<main>
  <h1>사이버폰도 상장</h1>
  <p class="sub">로드사이클갤러리 · 닉네임을 입력하면 상장을 발급해 드립니다</p>

  <form id="search">
    <input id="nick" placeholder="닉네임" autocomplete="off" required>
    <button type="submit">상장 받기</button>
  </form>
  <p id="msg"></p>
  <ul id="choices"></ul>

  <section id="result">
    <canvas id="cert" width="2480" height="3508"></canvas>
    <div class="actions">
      <button id="download">이미지 저장</button>
      <button id="again" class="ghost">다른 닉네임</button>
    </div>
  </section>
</main>

<script>
// 레이아웃은 1414x2000 좌표계로 그리고, 캔버스는 템플릿 원본(A4 300dpi) 해상도로 확대
const W = 1414, H = 2000;
const INK = "#1c1a16", GOLD = "#a67f0a", SUBTLE = "#6f6552", SEAL = "#c0262d";
const template = new Image();
template.src = "img/template.png";
const SERIF = '"Nanum Myeongjo", serif';
const BRUSH = '"Song Myung", "Nanum Myeongjo", serif';

let data = null;
let current = null;

const $ = (id) => document.getElementById(id);

async function loadData() {
  if (data) return data;
  const res = await fetch("results.json", { cache: "no-cache" });
  if (!res.ok) throw new Error("결과 파일을 불러오지 못했습니다.");
  data = await res.json();
  return data;
}

const SECTIONS = [
  { key: "total", title: "종합", rankKey: "rank_total" },
  { key: "distance", title: "거리", rankKey: "rank_distance" },
  { key: "elevation", title: "획득고도", rankKey: "rank_elevation" },
];

// 부문 수상자는 다른 순위표에서 빠져 있으므로, 순위가 하나뿐이면 그 부문 단독 상장으로 그림
function soloSection(entry) {
  const ranked = SECTIONS.filter((sec) => entry[sec.rankKey]);
  return ranked.length === 1 ? ranked[0] : null;
}

function awardName(entry, total) {
  const solo = soloSection(entry);
  if (solo && solo.key === "distance") return "장 거 리 왕 상";
  if (solo && solo.key === "elevation") return "산 악 왕 상";
  const rank = entry.rank_total;
  if (!rank) return "완 주 상";
  if (rank === 1) return "대   상";
  if (rank <= 3) return "최 우 수 상";
  if (rank <= Math.max(10, Math.ceil(total * 0.1))) return "우 수 상";
  return "완 주 상";
}

// ---- 메달 -----------------------------------------------------------------

const MEDAL = {
  1: ["#fff3b8", "#e0b52c", "#8f6a06"],
  2: ["#ffffff", "#c3c8ce", "#6f767e"],
  3: ["#ffd9b8", "#c07a3e", "#6e3f17"],
};

// UCI 월드챔피언 저지 순서 (위→아래 / 왼→오른)
const RAINBOW = ["#0067b1", "#e2231a", "#1b1b1b", "#fcd116", "#009b48"];

const JERSEY_GREEN = "#14a04a";
const POLKA_PINK = "#e8458f";

// 부문 1위 상징 저지: 종합=무지개(월드챔피언), 거리=그린, 획고=폴카닷
const JERSEYS = [
  { kind: "rainbow", rankKey: "rank_total", section: "total" },
  { kind: "green", rankKey: "rank_distance", section: "distance" },
  { kind: "polka", rankKey: "rank_elevation", section: "elevation" },
];

function jerseyOf(entry) {
  return JERSEYS.find((j) => entry[j.rankKey] === 1) || null;
}

// shape(Path2D, bbox x,y,w,h)를 저지 무늬로 채움. rainbow는 호출하는 쪽에서 줄무늬로 처리
function fillJersey(ctx, kind, shape, x, y, w, h, dot) {
  if (kind === "green") {
    ctx.fillStyle = JERSEY_GREEN;
    ctx.fill(shape);
    return;
  }
  ctx.save();
  ctx.fillStyle = "#fff";
  ctx.fill(shape);
  ctx.clip(shape);
  ctx.fillStyle = POLKA_PINK;
  const step = dot * 3.2;
  for (let row = 0, yy = y + step / 2; yy < y + h + step; row++, yy += step * 0.75) {
    for (let xx = x + (row % 2 ? step / 2 : 0); xx < x + w + step; xx += step) {
      ctx.beginPath();
      ctx.arc(xx, yy, dot, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
  ctx.strokeStyle = POLKA_PINK;
  ctx.lineWidth = 1;
  ctx.stroke(shape);
}

function drawJerseyBand(ctx, kind, cx, y, width, height) {
  const x = cx - width / 2;
  if (kind === "rainbow") {
    const stripe = height / RAINBOW.length;
    RAINBOW.forEach((color, i) => {
      ctx.fillStyle = color;
      ctx.fillRect(x, y + i * stripe, width, stripe);
    });
    return;
  }
  const shape = new Path2D();
  shape.rect(x, y, width, height);
  fillJersey(ctx, kind, shape, x, y, width, height, height * 0.2);
}

function drawMedal(ctx, cx, cy, r, rank, ribbon, jersey = null) {
  const [hi, mid, dark] = MEDAL[rank];
  ctx.save();
  if (ribbon) {
    const rw = r * 0.55, rh = r * 1.5;
    const yb = cy - r * 0.6, yt = yb - rh;
    [[-1, "#b3262d"], [1, "#23345c"]].forEach(([dir, color]) => {
      // 리본 한 쪽 평행사변형: 아래 변 a→d, 위 변 b→c
      const a = cx + dir * r * 0.15, d = a + dir * rw;
      const b = cx + dir * (r * 0.15 + rw), c = b + dir * rw;
      if (jersey === "green" || jersey === "polka") {
        const shape = new Path2D();
        shape.moveTo(a, yb); shape.lineTo(b, yt); shape.lineTo(c, yt); shape.lineTo(d, yb);
        shape.closePath();
        fillJersey(ctx, jersey, shape, Math.min(a, c), yt, Math.abs(c - a), rh, r * 0.07);
        return;
      }
      const colors = jersey === "rainbow" ? (dir < 0 ? [...RAINBOW].reverse() : RAINBOW) : [color];
      colors.forEach((col, k) => {
        const t0 = k / colors.length, t1 = (k + 1) / colors.length;
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(a + (d - a) * t0, yb);
        ctx.lineTo(b + (c - b) * t0, yt);
        ctx.lineTo(b + (c - b) * t1, yt);
        ctx.lineTo(a + (d - a) * t1, yb);
        ctx.closePath();
        ctx.fill();
      });
    });
  }
  const g = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.1, cx, cy, r);
  g.addColorStop(0, hi);
  g.addColorStop(0.55, mid);
  g.addColorStop(1, dark);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = dark;
  ctx.lineWidth = Math.max(1.5, r * 0.06);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.78, 0, Math.PI * 2);
  ctx.strokeStyle = "rgba(255,255,255,0.55)";
  ctx.lineWidth = Math.max(1, r * 0.04);
  ctx.stroke();
  ctx.fillStyle = dark;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = `800 ${r * 1.05}px ${SERIF}`;
  ctx.fillText(String(rank), cx, cy + r * 0.06);
  ctx.restore();
}


// ---- 직인 -----------------------------------------------------------------

function drawSeal(ctx, cx, cy, size) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-0.04);
  ctx.globalAlpha = 0.88;
  ctx.strokeStyle = SEAL;
  ctx.fillStyle = SEAL;
  const h = size / 2;
  ctx.lineWidth = 9;
  roundRect(ctx, -h, -h, size, size, 14);
  ctx.stroke();
  ctx.lineWidth = 2.5;
  roundRect(ctx, -h + 13, -h + 13, size - 26, size - 26, 8);
  ctx.stroke();

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = `800 ${size * 0.2}px ${SERIF}`;
  ctx.fillText("SCOPE", 0, -size * 0.14);
  ctx.font = `${size * 0.3}px ${BRUSH}`;
  ctx.fillText("之 印", 0, size * 0.19);

  // 인주 번짐 느낌: 군데군데 지우기
  ctx.globalCompositeOperation = "destination-out";
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < 90; i++) {
    ctx.globalAlpha = 0.25 + rnd() * 0.5;
    ctx.beginPath();
    ctx.arc((rnd() - 0.5) * size, (rnd() - 0.5) * size, 1 + rnd() * 3.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---- 본문 -----------------------------------------------------------------

function fitFont(ctx, text, weight, family, size, maxWidth) {
  do {
    ctx.font = `${weight} ${size}px ${family}`;
    if (ctx.measureText(text).width <= maxWidth) break;
    size -= 2;
  } while (size > 20);
  return size;
}

function drawCertificate(entry, meta) {
  const canvas = $("cert");
  canvas.width = template.naturalWidth || W * 2;
  canvas.height = template.naturalHeight || H * 2;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (template.naturalWidth) ctx.drawImage(template, 0, 0);
  ctx.scale(canvas.width / W, canvas.height / H);

  const left = 220, right = W - 220;
  ctx.fillStyle = INK;
  ctx.textBaseline = "alphabetic";

  // 호수
  ctx.textAlign = "left";
  ctx.font = `400 32px ${SERIF}`;
  ctx.fillText(`제 2026-${String(meta.results.indexOf(entry) + 1).padStart(3, "0")} 호`, left, 330);

  // 제목
  ctx.textAlign = "center";
  ctx.font = `800 170px ${SERIF}`;
  ctx.fillText("상    장", W / 2, 560);

  ctx.fillStyle = GOLD;
  ctx.font = `700 48px ${SERIF}`;
  ctx.fillText(awardName(entry, meta.totals.total), W / 2, 670);
  const jersey = jerseyOf(entry);
  if (jersey) drawJerseyBand(ctx, jersey.kind, W / 2, 698, 380, 25);

  // 닉네임
  ctx.fillStyle = INK;
  ctx.textAlign = "right";
  const label = "닉네임  ";
  ctx.font = `400 38px ${SERIF}`;
  const labelW = ctx.measureText(label).width;
  const nickSize = fitFont(ctx, entry.nickname, 800, SERIF, 58, right - left - labelW - 40);
  ctx.font = `800 ${nickSize}px ${SERIF}`;
  const nickW = ctx.measureText(entry.nickname).width;
  ctx.fillText(entry.nickname, right, 810);
  ctx.fillStyle = SUBTLE;
  ctx.font = `400 38px ${SERIF}`;
  ctx.fillText(label, right - nickW, 810);

  // 성적
  const val = (v, unit, digits = 0) =>
    v == null ? "-" : `${v.toLocaleString("ko-KR", { maximumFractionDigits: digits })} ${unit}`;
  const values = {
    total: val(entry.score, "점", 2),
    distance: val(entry.distance, "km", 2),
    elevation: val(entry.elevation, "m"),
  };
  const solo = soloSection(entry);
  ctx.strokeStyle = GOLD;

  if (solo) {
    // 부문 단독: 큰 메달 + 부문 순위 + 기록
    const rank = entry[solo.rankKey];
    const top = 900, bottom = 1250, cy = top + 235;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(left, top); ctx.lineTo(right, top);
    ctx.moveTo(left, bottom); ctx.lineTo(right, bottom);
    ctx.stroke();

    const medalX = left + 210;
    if (MEDAL[rank]) drawMedal(ctx, medalX, cy, 100, rank, true, jersey && jersey.section === solo.key ? jersey.kind : null);
    const tx = medalX + 170;
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = INK;
    ctx.font = `700 46px ${SERIF}`;
    const head = `${solo.title} 부문  `;
    ctx.fillText(head, tx, cy - 30);
    const headW = ctx.measureText(head).width;
    ctx.fillStyle = SEAL;
    ctx.font = `800 84px ${SERIF}`;
    ctx.fillText(`${rank}위`, tx + headW, cy - 30);
    ctx.fillStyle = INK;
    ctx.font = `800 64px ${SERIF}`;
    ctx.fillText(values[solo.key], tx, cy + 55);
    if (solo.key === "total") {
      ctx.fillStyle = SUBTLE;
      ctx.font = `400 32px ${SERIF}`;
      ctx.fillText(`${values.distance}  ·  ${values.elevation}`, tx, cy + 100);
    }
  } else {
    const rows = [
      ["종합순위", entry.rank_total, meta.totals.total, "점수", values.total],
      ["거리순위", entry.rank_distance, meta.totals.distance, "주행거리", values.distance],
      ["획득고도순위", entry.rank_elevation, meta.totals.elevation, "획득고도", values.elevation],
    ];
    const top = 900, rowH = 104;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(left, top); ctx.lineTo(right, top);
    ctx.moveTo(left, top + rowH * rows.length); ctx.lineTo(right, top + rowH * rows.length);
    ctx.stroke();
    ctx.lineWidth = 0.8;
    ctx.setLineDash([4, 6]);
    for (let i = 1; i < rows.length; i++) {
      ctx.beginPath();
      ctx.moveTo(left + 20, top + rowH * i);
      ctx.lineTo(right - 20, top + rowH * i);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    rows.forEach(([name, rank, total, dataLabel, value], i) => {
      const y = top + rowH * i + rowH / 2 + 14;
      ctx.textAlign = "left";
      ctx.fillStyle = INK;
      ctx.font = `700 38px ${SERIF}`;
      ctx.fillText(name, left + 24, y);

      if (MEDAL[rank]) drawMedal(ctx, left + 300, y - 14, 26, rank, false);
      const rankText = rank ? `${rank}위` : "-";
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      ctx.fillStyle = SEAL;
      ctx.font = `800 50px ${SERIF}`;
      ctx.fillText(rankText, left + 340, y);
      const rankW = ctx.measureText(rankText).width;
      ctx.fillStyle = SUBTLE;
      ctx.font = `400 28px ${SERIF}`;
      if (rank && total) ctx.fillText(` / ${total}명`, left + 340 + rankW, y);

      ctx.textAlign = "right";
      ctx.fillText(dataLabel, right - 240, y);
      ctx.fillStyle = INK;
      ctx.font = `700 38px ${SERIF}`;
      ctx.fillText(value, right - 24, y);
    });
  }

  // 본문
  ctx.fillStyle = INK;
  ctx.textAlign = "center";
  ctx.font = `400 50px ${SERIF}`;
  const body = [
    solo ? `위 사람은 2026 사이버폰도 ${solo.title} 부문에서` : "위 사람은 2026 사이버폰도에 참가하여",
    "위와 같은 성적을 기록하였기에",
    "이 상장을 수여합니다.",
  ];
  body.forEach((line, i) => ctx.fillText(line, W / 2, 1370 + i * 88));

  // 날짜
  const [y, mo, d] = meta.date.split("-").map(Number);
  ctx.font = `400 40px ${SERIF}`;
  ctx.fillText(`${y}년  ${mo}월  ${d}일`, W / 2, 1650);

  // 수여 기관 + 직인
  ctx.font = `800 56px ${SERIF}`;
  const org = "로드사이클갤러리  SCOPE";
  ctx.fillText(org, W / 2 - 40, 1790);
  const orgW = ctx.measureText(org).width;
  drawSeal(ctx, W / 2 - 40 + orgW / 2 + 95, 1770, 160);
}

async function ensureFonts(entry) {
  const text = "장거리산악왕부문중상장대최우수완주제호닉네임종합거리획득고도순위점수주행위사람은사이버폰도에참가하여와같은성적을기록하였기이를수여합니다년월일로드클갤러리之印명 /0123456789.,:-kmSCOPE" + entry.nickname;
  await Promise.all([
    template.decode().catch(() => {}),
    document.fonts.load(`180px "Song Myung"`, text),
    document.fonts.load(`400 40px "Nanum Myeongjo"`, text),
    document.fonts.load(`700 40px "Nanum Myeongjo"`, text),
    document.fonts.load(`800 40px "Nanum Myeongjo"`, text),
  ]);
}

async function show(entry) {
  current = entry;
  $("choices").innerHTML = "";
  $("msg").textContent = "상장을 그리는 중...";
  try { await ensureFonts(entry); } catch (_) { /* 폰트 실패 시 기본 글꼴로 */ }
  drawCertificate(entry, data);
  $("msg").textContent = "";
  $("result").style.display = "block";
  $("result").scrollIntoView({ behavior: "smooth", block: "start" });
}

$("search").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("result").style.display = "none";
  $("choices").innerHTML = "";
  const q = $("nick").value.trim();
  if (!q) return;
  try {
    await loadData();
  } catch (err) {
    $("msg").textContent = err.message;
    return;
  }
  const norm = (s) => s.toLowerCase().replace(/\s+/g, "");
  const exact = data.results.filter((r) => norm(r.nickname) === norm(q));
  const matches = exact.length ? exact : data.results.filter((r) => norm(r.nickname).includes(norm(q)));

  if (matches.length === 1) return show(matches[0]);
  if (!matches.length) {
    $("msg").textContent = "최종 순위표에서 닉네임을 찾지 못했습니다. 닉네임을 확인해 주세요.";
    return;
  }
  $("msg").textContent = `${matches.length}명이 검색되었습니다. 본인을 선택해 주세요.`;
  for (const r of matches.slice(0, 30)) {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = r.nickname;
    const small = document.createElement("small");
    const best = SECTIONS.find((sec) => r[sec.rankKey]);
    small.textContent = best ? `${best.title} ${r[best.rankKey]}위` : "";
    btn.appendChild(small);
    btn.addEventListener("click", () => show(r));
    li.appendChild(btn);
    $("choices").appendChild(li);
  }
});

$("download").addEventListener("click", () => {
  const a = document.createElement("a");
  a.download = `사이버폰도_상장_${current.nickname}.png`;
  a.href = $("cert").toDataURL("image/png");
  a.click();
});

$("again").addEventListener("click", () => {
  $("result").style.display = "none";
  $("nick").value = "";
  $("nick").focus();
